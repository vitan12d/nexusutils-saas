    <script>
      // Prevent TypeError when third-party libraries or polyfills attempt to overwrite window.fetch in sandboxed iframe environment
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var fetchDescriptor = {
              get: function() { return originalFetch; },
              set: function(val) { originalFetch = val; },
              configurable: true,
              enumerable: true
            };
            Object.defineProperty(window, 'fetch', fetchDescriptor);
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              Object.defineProperty(globalThis, 'fetch', fetchDescriptor);
            }
          }
        } catch (e) {
          console.warn("Could not patch window.fetch property descriptor safely:", e);
        }
      })();
    </script>
