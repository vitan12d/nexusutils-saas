<!doctype html>
<html lang="en">
  <head>
    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" errors in iframe/sandbox environments
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            var customFetch = origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return customFetch;
              },
              set: function(val) {
                customFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Unable to make window.fetch writable:', e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Live Score & Sports Analytics Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
